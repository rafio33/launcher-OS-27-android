name: Build iOS 27 Spatial Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

          
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/iOS27-Spatial-Launcher.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS27-Spatial-Launcher-APK
          path: output_apk/iOS27-Spatial-Launcher.apk